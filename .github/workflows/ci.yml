name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CI: "true"
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  TOKENIZERS_PARALLELISM: "false"
  UV_NO_PROGRESS: "true"

jobs:
  core:
    name: Core · Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.1"
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked --dev --python "${{ matrix.python-version }}"
      - run: make check

  wheel:
    name: Clean wheel install
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.1"
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --locked --dev
      - run: make wheel-smoke

  optional:
    name: Optional · ${{ matrix.extra }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - extra: boost
            test: tests/optional/test_boosting.py
          - extra: deep
            test: tests/optional/test_deep_learning.py
          - extra: api
            test: tests/optional/test_api.py
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.1"
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --locked --dev --extra "${{ matrix.extra }}"
      - run: uv run pytest "${{ matrix.test }}"
      - run: uv run python scripts/smoke_examples.py --optional "${{ matrix.extra }}"
